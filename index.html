<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Jadwal Ujian Semester - SMK Yadika Kopandakan II</title>
  <link id="faviconLink" rel="icon" type="image/png" href="./logo-yadika.png" />
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --border: #e2e8f0;
      --badge-bg: #eff6ff;
      --badge-text: #1d4ed8;
      --success: #0f766e;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --danger: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* BANNER HEADER SEKOLAH */
    header {
      background: linear-gradient(135deg, #0b152c 0%, #172554 45%, #1d4ed8 100%);
      color: #ffffff;
      padding: 28px 16px;
      position: relative;
      overflow: hidden;
      border-bottom: 4px solid #facc15;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.18);
    }

    header::before {
      content: "";
      position: absolute;
      top: -60px;
      right: -40px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 18px;
      flex: 1 1 540px;
    }

    .logo-frame {
      width: 78px;
      height: 78px;
      flex-shrink: 0;
      background: #ffffff;
      border-radius: 16px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25), 0 0 0 3px rgba(255, 255, 255, 0.22);
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .header-title .yayasan-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fde047;
      margin-bottom: 2px;
    }

    .header-title h1 {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .header-title p {
      margin: 0 0 10px;
      font-size: 14px;
      color: #e2e8f0;
    }

    .header-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .info-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: #f8fafc;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .info-pill-accent {
      background: rgba(250, 204, 21, 0.18);
      border-color: rgba(250, 204, 21, 0.45);
      color: #fef08a;
    }

    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.25);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 640px) {
      .brand-group {
        align-items: center;
        gap: 14px;
      }
      .logo-frame {
        width: 64px;
        height: 64px;
        border-radius: 12px;
      }
      .header-title h1 {
        font-size: 20px;
      }
      .header-actions {
        width: 100%;
      }
      .header-actions .btn {
        width: 100%;
        justify-content: center;
      }
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(.disabled) {
      background: var(--primary-hover);
    }

    .btn-primary.disabled {
      opacity: 0.45;
      pointer-events: none;
      cursor: not-allowed;
    }

    .btn-light {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
    }

    .btn-light:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .btn-outline {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: #f8fafc;
    }

    .btn-outline.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-today {
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      white-space: nowrap;
    }

    .btn-today:hover {
      background: #dbeafe;
    }

    .btn-today.active {
      background: #0f766e;
      color: #ffffff;
      border-color: #0f766e;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 40px;
      flex: 1;
    }

    /* BANNER PENGUMUMAN PANITIA */
    .announcement {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-left: 4px solid #f59e0b;
      color: #78350f;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .announcement-badge {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      color: #92400e;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      margin-top: 1px;
    }

    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 2fr auto 1fr 1fr auto;
      gap: 10px;
      align-items: center;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
    }

    @media (max-width: 920px) {
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }
      .toolbar > input {
        grid-column: 1 / -1;
      }
      .view-toggle {
        grid-column: 1 / -1;
        justify-content: flex-end;
      }
    }

    @media (max-width: 560px) {
      .toolbar {
        grid-template-columns: 1fr;
      }
      .btn-today {
        width: 100%;
        justify-content: center;
      }
      .view-toggle {
        justify-content: stretch;
      }
      .view-toggle .btn {
        flex: 1;
        justify-content: center;
      }
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background: #ffffff;
    }

    input:focus, select:focus {
      outline: 2px solid rgba(29, 78, 216, 0.25);
      border-color: var(--primary);
    }

    .view-toggle {
      display: flex;
      gap: 6px;
    }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .status-ok {
      color: var(--success);
      font-weight: 600;
    }

    .status-err {
      color: var(--danger);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
    }

    .card.status-live-card {
      border-left-color: #10b981;
    }

    .card.status-today-card {
      border-left-color: #f59e0b;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .mapel-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .card-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .sched-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .sched-live {
      background: var(--success-bg);
      color: var(--success);
      border-color: var(--success-border);
    }

    .sched-today {
      background: var(--warn-bg);
      color: var(--warn);
      border-color: var(--warn-border);
    }

    .sched-other {
      background: #f1f5f9;
      color: #475569;
      border-color: #e2e8f0;
    }

    .meta-list {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      font-size: 14px;
      color: #334155;
    }

    .meta-list li {
      margin-bottom: 4px;
      text-transform: capitalize;
    }

    .meta-label {
      color: var(--muted);
      font-weight: 600;
    }

    .card-footer {
      display: flex;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: #f8fafc;
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .empty-state {
      background: var(--surface);
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    /* FOOTER SEKOLAH */
    footer {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 20px 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .footer-school {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 600;
    }

    .footer-school img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .footer-note {
      margin: 0;
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal {
      background: var(--surface);
      border-radius: 14px;
      max-width: 460px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 20px;
      text-transform: capitalize;
    }

    .modal p {
      margin: 0 0 14px;
      font-size: 14px;
      color: var(--muted);
    }

    .modal-detail {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 14
